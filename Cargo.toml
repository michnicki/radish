[package]
name = "Radish"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "radish"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
lofty = "0.25.1"
notify = "8.2.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "macros"] }
tokio = { version = "1.53.1", features = ["full"] }
walkdir = "2.5"
