[package]
name = "Radish"
version = "0.1.0"
edition = "2024"

[lib]
name = "radish"
path = "src/lib.rs"

[[bin]]
name = "radish"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
bzip2 = "0.6.1"
clap = { version = "4.6.6", features = ["derive"] }
discogger = { git = "https://github.com/isabelgk/discogger.git", rev = "8e9bef2ac1c893cb4ea685e49334cc91ba8dbe5b" }
dotenvy = "0.15"
flate2 = "1.1.11"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
httpdate = "1"
indicatif = "0.18"
lofty = "0.25.1"
md-5 = "0.11.0"
notify = "8.2.0"
quick-xml = "0.42.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tar = "0.4.46"
tokio = { version = "1.53.1", features = ["full"] }
unicode-normalization = "0.1.24"
unicode-width = "0.2"
uuid = { version = "1", default-features = false, features = ["std", "serde"] }
walkdir = "2.5"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
